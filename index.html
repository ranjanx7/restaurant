<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0"
    >

    <title>AloGlow Restaurant</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="site-header">
        <div class="container">

            <a href="#" class="logo">
                ALOGLOW
            </a>

            <nav class="main-nav" aria-label="Main navigation">
                <ul class="nav-list">
                    <li>
                        <a href="#home">Home</a>
                    </li>

                    <li>
                        <a href="#about">About</a>
                    </li>

                    <li>
                        <a href="#menu">Menu</a>
                    </li>

                    <li>
                        <a href="#contact">Contact</a>
                    </li>
                </ul>
            </nav>

            <a href="#reservation" class="reservation-button">
                Reserve a Table
            </a>

        </div>
    </header>


    <main>

        <!-- Hero Section -->
        <section class="hero" id="home">

            <div class="container hero-grid">

                <div class="hero-content">

                    <p class="hero-label">
                        Welcome to AloGlow
                    </p>

                    <h1>
                        Good Food.
                        <span>Good Mood.</span>
                    </h1>

                    <p class="hero-description">
                        Fresh ingredients, thoughtful recipes, and
                        unforgettable flavors made with passion.
                    </p>

                    <a href="#menu" class="hero-button">
                        Explore Our Menu
                    </a>

                </div>


                <div class="hero-image">
                    <img 
                        src="images/resturantt.jpg"
                        alt="Freshly prepared restaurant dish"
                    >
                </div>

            </div>

        </section>

    </main>

</body>
</html>
